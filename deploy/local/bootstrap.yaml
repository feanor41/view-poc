apiVersion: batch/v1
kind: Job
metadata:
  name: sql-bootstrap
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: mcr.microsoft.com/mssql/server:2022-CU23-ubuntu-22.04
          env:
            - name: SQLCMDPASSWORD
              valueFrom:
                secretKeyRef:
                  name: sql-admin
                  key: password
          envFrom:
            - secretRef:
                name: sql-bootstrap-passwords
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              for attempt in $(seq 1 90); do
                if /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -C -b -Q 'SELECT 1' >/dev/null 2>&1; then
                  {
                    printf ':setvar AccountsPassword "%s"\n' "$AccountsPassword"
                    printf ':setvar FinancialsPassword "%s"\n' "$FinancialsPassword"
                    printf ':setvar CasesPassword "%s"\n' "$CasesPassword"
                    printf ':setvar NotificationsPassword "%s"\n' "$NotificationsPassword"
                    cat /bootstrap/init.sql
                  } | /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -C -b -i /dev/stdin
                  exit 0
                fi
                sleep 5
              done
              echo 'SQL Server did not become ready' >&2
              exit 1
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
      volumes:
        - name: bootstrap
          configMap:
            name: sql-bootstrap
